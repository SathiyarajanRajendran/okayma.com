# THIS IS A CLOUDFLARE **PAGES** PROJECT, NOT A WORKER.
#
# Deploys happen on `git push` to main: the Pages project is Git-connected.
# `npm run deploy` (wrangler pages deploy) still works and is kept for
# emergencies only -- a manual upload and a Git build both publish to
# production, and whichever ran last wins.
#
# A plain `wrangler deploy` will always fail here, by design:
#
#   It looks like you've run a Workers-specific command in a Pages project.
#   For Pages, please run `wrangler pages deploy` instead.
#
# If CI reports a failing "Workers Builds" check against this repo, the repo is
# not the problem — a Workers service has been pointed at it and is running the
# wrong deploy command. Fix that in the Cloudflare dashboard. Do NOT convert
# this file into a Workers config to silence the check: that would break the
# Pages deployment which actually serves okayma.com.

name = "okayma"
compatibility_date = "2025-07-18"
pages_build_output_dir = "public"

# Static site lives in public/. API lives in functions/ and is compiled into
# Cloudflare Pages Functions at deploy time.

[[d1_databases]]
binding = "DB"
database_name = "okayma-db"
database_id = "ea961915-75c8-4c63-892b-538dee038cdf"

[vars]
SITE_URL = "https://okayma.com"
MAIL_FROM = "Okayma.com <no-reply@okayma.com>"
ADMIN_EMAIL = "sathiya@okayma.com"

# Secrets are NOT set here. Set them on the Pages project:
#   npx wrangler@3 pages secret put RESEND_API_KEY     --project-name=okayma
#   npx wrangler@3 pages secret put ADMIN_PASSWORD_HASH --project-name=okayma
